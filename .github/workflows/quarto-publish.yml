name: Render & Publish Quarto Website to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies & Jupyter
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install jupyter nbformat nbclient ipykernel notebook pandas numpy scipy statsmodels optuna matplotlib plotly kagglehub
          pip install -e .
          sudo apt-get update && sudo apt-get install -y python3-pip python3-setuptools
          python3 -m pip install jupyter nbformat nbclient ipykernel notebook --break-system-packages || true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build Interactive Website Views
        run: |
          python paper_scripts/build_website_views.py

      - name: Render Quarto Website
        run: |
          cd website
          quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

name: Render & Publish Quarto Website to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Package & Jupyter Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install kagglehub
          pip install -e .

      - name: Build Interactive Website Views
        run: |
          python paper_scripts/build_website_views.py

      - name: Render Quarto Website
        run: |
          cd website
          quarto render

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/_site

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/_site

      - name: Deploy to GitHub Pages Environment
        id: deployment
        uses: actions/deploy-pages@v4

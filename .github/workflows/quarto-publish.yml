name: Render & Publish Quarto Website to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python Dependencies & Jupyter
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install jupyter nbformat nbclient ipykernel pandas numpy scipy statsmodels optuna matplotlib plotly kagglehub
          pip install -e .
          python3 -m pip install jupyter nbformat nbclient ipykernel || true

      - name: Render Quarto Website
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PYTHON: ${{ env.pythonLocation }}/bin/python
        with:
          path: website

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

project:
  type: website
  output-dir: _site

website:
  title: "MultiElo Football"
  favicon: "https://raw.githubusercontent.com/cesarrennocosta/multielo-football/main/docs/favicon.ico"
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Team Trajectories"
        href: ratings.qmd
      - text: "Normalized Trajectories"
        href: ratings_norm.qmd
      - text: "World #1 Style"
        href: world_no1.qmd
      - text: "Style Space"
        href: style_space.qmd
      - text: "Model Hierarchy"
        href: models.qmd
    right:
      - icon: github
        href: https://github.com/cesarrennocosta/multielo-football

execute:
  eval: false
  freeze: true

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    grid:
      sidebar-width: 0px
      body-width: 1000px
      margin-width: 200px

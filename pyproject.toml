[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multielo-football"
version = "0.1.0"
description = "Multi-Dimensional Elo Ratings and Poisson Prediction Hierarchy for International Football"
readme = "README.md"
authors = [
    { name = "César Rennó-Costa", email = "cesar@imd.ufrn.br" },
    { name = "László Csató", email = "laszlo.csato@sztaki.hun-ren.hu" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "optuna>=3.0.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
    "jupyter>=1.0.0",
    "nbformat>=5.0.0",
    "nbclient>=0.5.0",
    "ipykernel>=6.0.0"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/cesarrennocosta/multielo-football"
Repository = "https://github.com/cesarrennocosta/multielo-football"
Documentation = "https://cesarrennocosta.github.io/multielo-football/"

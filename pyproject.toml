[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multielo-football"
version = "0.1.0"
description = "Multi-Dimensional Elo Ratings and Poisson Prediction Hierarchy for International Football"
readme = "README.md"
authors = [
    { name = "César Rennó-Costa", email = "cesar@imd.ufrn.br" },
    { name = "László Csató", email = "laszlo.csato@sztaki.hun-ren.hu" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "optuna>=3.0.0",
    "matplotlib>=3.4.0"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/rennocosta/matchdataset"
Repository = "https://github.com/rennocosta/matchdataset"
